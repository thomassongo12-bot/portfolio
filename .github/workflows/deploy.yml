name: Deploy to Hosting

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          # Exclure les fichiers sensibles et les données locales
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            data/auth.json
            data/messages.json
            data/settings.json
            data/bruteforce.json
            data/security.log
            data/.setup_done
            assets/images/profile.*
            assets/images/projects/*.png
            assets/images/projects/*.jpg
            assets/images/projects/*.webp
            assets/files/*.pdf
            setup.php
            DEPLOY.md
